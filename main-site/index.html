<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>无界 · 云巅之上</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#080c16;color:#e2e8f0;font-family:sans-serif}
#app{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1rem;padding:2rem}
.spinner{width:40px;height:40px;border:3px solid rgba(99,102,241,0.15);border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite;margin-bottom:.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
#status{color:#94a3b8;font-size:.9rem}
#error{color:#ef4444;font-size:.85rem;display:none;max-width:320px;text-align:center;line-height:1.5;word-break:break-all}
.retry-btn{display:none;margin-top:.8rem;padding:.5rem 1.2rem;background:#6366f1;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:.85rem}
</style>
</head>
<body>
<div id="app">
  <div class="spinner" id="spinner"></div>
  <div id="status">正在加载...</div>
  <div id="error"></div>
  <button class="retry-btn" id="retryBtn">重新加载</button>
</div>
<script>
function _s(m){document.getElementById("status").textContent=m}
function _e(m){
  document.getElementById("spinner").style.display="none";
  document.getElementById("status").style.display="none";
  document.getElementById("error").textContent=m;
  document.getElementById("error").style.display="block";
  document.getElementById("retryBtn").style.display="inline-block";
  console.error("SKPNN:",m);
}
document.getElementById("retryBtn").onclick=function(){location.reload()};

function hex(b){var s='';for(var i=0;i<b.length;i++){var h=b[i].toString(16);s+=h.length<2?'0'+h:h}return s}

(function(){if(!window.crypto||!window.crypto.subtle){_e("浏览器不支持Web Crypto");return}
var enc=new TextEncoder(),dec=new TextDecoder();

async function genNonce(challenge){
  var prefix="",B=500,i=0,encC=enc.encode(challenge);
  for(var z=0;z<5;z++)prefix+="0";
  
  while(true){
    var ps=[];
    for(var j=0;j<B;j++){
      (function(nonce){
        var ns=String(nonce);
        var buf=new Uint8Array(encC.length+ns.length);
        buf.set(encC);buf.set(enc.encode(ns),encC.length);
        ps.push(crypto.subtle.digest("SHA-256",buf).then(function(b){return hex(new Uint8Array(b))}));
      })(i+j);
    }
    var hashes=await Promise.all(ps);
    for(var j=0;j<B;j++){
      for(var k=0;k<5;k++)if(hashes[j][k]!=='0')break;
      if(k===5)return String(i+j);
    }
    i+=B;
    _s("验证中... ("+(i>>10)+"k)");
    await new Promise(function(r){setTimeout(r,0)});
  }
}

async function tryLoad(){
  var cached=sessionStorage.getItem("skpnn_tok");
  if(cached){try{
    var cr=await fetch("/loader.php?action=page&t="+encodeURIComponent(cached));
    if(cr.ok){var cd=await cr.json();await render(cd.d,cached);return}
  }catch(e){}}

  for(var attempt=0;attempt<3;attempt++){
    try{
      _s("初始化连接...");
      var r1=await fetch("/loader.php?action=challenge&_="+Date.now());
      if(!r1.ok){_e("连接失败: "+r1.status);return}
      var j1=await r1.json();
      if(!j1.c||!j1.d){_e("服务器响应异常: "+JSON.stringify(j1).slice(0,100));return}
      var chal=j1.c,diff=j1.d;

      _s("验证中...");
      var nonce=await genNonce(chal);

      var r2=await fetch("/loader.php?action=fetch&c="+encodeURIComponent(chal)+"&n="+nonce);
      if(r2.status===400){_e("挑战过期，请刷新");return}
      if(r2.status===403){try{var ej=await r2.json();_e("验证失败: "+(ej.e||"unknown"))}catch(ex){_e("验证失败: 403")}return}
      if(!r2.ok){_e("提交失败: "+r2.status);return}
      var token=(await r2.json()).t;
      sessionStorage.setItem("skpnn_tok",token);

      _s("加载页面...");
      var r3=await fetch("/loader.php?action=page&t="+encodeURIComponent(token));
      if(!r3.ok){_e("页面失败: "+r3.status);return}
      var pd=await r3.json();
      await render(pd.d,token);
      return;
    }catch(e){if(attempt<2){_s("重试"+(attempt+1));await new Promise(function(r){setTimeout(r,1000)})}else{_e(""+e.message)}}
  }
}

async function render(encData,token){
  _s("解密中...");
  if(token.length!==64){_e("令牌格式错误");return}
  var raw=atob(encData),rawB=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)rawB[i]=raw.charCodeAt(i);
  var keyB=new Uint8Array(32);
  for(var i=0;i<32;i++)keyB[i]=parseInt(token.substr(i*2,2),16);
  var key=await crypto.subtle.importKey("raw",keyB,{name:"AES-GCM"},false,["decrypt"]);
  var pt=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:rawB.subarray(0,12)},key,rawB.subarray(12)));
  document.open();document.write(dec.decode(pt));document.close();
}

tryLoad();
})();
</script>
</body>
</html>
